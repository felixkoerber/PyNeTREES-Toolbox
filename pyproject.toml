[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetrees"
version = "0.1.4"
description = "Python port of the TREES toolbox for neuronal tree reconstruction, editing, analysis and synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
# scikit-image supplies marching cubes for hull_tree's 3D isosurface;
# the 2D contour path needs only matplotlib.
plot = ["pyvista>=0.44", "matplotlib>=3.7", "scikit-image>=0.22"]
# NEURON has no Windows pip wheel -- Windows users need the official binary
# installer (neuronsimulator.github.io) instead; this extra is a convenience
# for Linux/macOS, where `pip install neuron` works directly.
neuron = ["neuron>=8.0"]
# MATLAB v7.3 (.mat/.mtr) files are HDF5, which scipy.io cannot read -- and
# MATLAB's own save_tree writes v7.3 unconditionally, so this is needed for
# any .mtr produced by a current TREES install. mat73 is used rather than
# pymatreader/hdf5storage because it is the only one that dereferences
# nested cell arrays of structs; see io/_matlab.py and Design Decision #47.
matlab = ["mat73>=0.60"]
# .nmf is HDF5 too. h5py already arrives with `matlab` (mat73 depends on
# it), so this extra exists only so that "I want .nmf" does not read as
# "I want MATLAB support".
nmf = ["h5py>=3.8"]
# Image stacks. tifffile reads the multi-page TIFFs microscopes emit;
# scikit-image supplies the 3D skeletonisation that replaces MATLAB's
# hand-rolled thinning (see GUI_AND_STACKS.md).
stacks = ["tifffile>=2023.7.10", "imageio>=2.31", "scikit-image>=0.22"]
# Blender export and headless rendering (pynetrees.blender), superseding
# MATLAB's pov_tree/x3d_tree. Deliberately NOT a default dependency: bpy is
# a ~300 MB wheel, ships only for the exact Python version it was built
# against, and pins numpy < 2. Nothing else in the package needs it, and
# `import pynetrees` never imports pynetrees.blender.
blender = ["bpy>=4.0"]
dev = ["pytest>=8.0"]
# Running the example notebooks in examples/. ipykernel is what lets Jupyter
# execute any of them; the trame stack drives the live 3D widgets in
# examples/plot.ipynb. Not needed by the package itself.
notebook = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "trame>=3.0",
    "trame-vtk>=2.0",
    "trame-vuetify>=2.0",
]
# The recommended default install on Linux/macOS: everything except Blender.
# bpy is left out on purpose -- it is a ~300 MB wheel that pins numpy < 2
# (see above).
all = ["pynetrees[all-no-neuron,neuron]"]
# The recommended default on Windows, where NEURON has no pip wheel: same as
# `all` minus `neuron`. Install NEURON from the official binary installer
# afterwards (see the README).
all-no-neuron = ["pynetrees[plot,matlab,nmf,stacks,notebook,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynetrees = ["data/*.swc", "data/*.npz", "data/*.mtr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: renders an image through Blender; deselect with -m 'not slow'",
]
